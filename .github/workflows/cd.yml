name: Frontend CD

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  pull-requests: read

jobs:
  cd:
    name: Build Test Security Docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create env file
        run: |
          printf '%s' "${{ secrets.VITE_ENV }}" > .env.production

      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secret-files: |
            env=.env.production
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            # Тянем только образ фронтенда. Раньше здесь стоял `docker compose pull`,
            # который заодно тянул postgres с Docker Hub. Тот упирался в лимит
            # обращений (429) и обрывал загрузку до того, как скачивался нужный
            # образ. Контейнер оставался на старой сборке, а шаг рапортовал успех.
            # `set -e` гарантирует, что неудачная загрузка теперь роняет выкатку.
            docker compose pull app
            docker compose up -d --no-deps app
